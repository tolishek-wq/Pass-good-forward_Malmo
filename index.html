<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[PROJECT NAME] — Investor demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F6F4EF; --desk: #ECE8E0; --ink: #15213B; --ink2: #3B4659; --muted: #4A5568; --line: #E6E1D8;
  --green: #1E7A4C; --green-d: #155C39; --green-t: #E3F0E8; --coral: #D9663F; --coral-d: #93401C; --coral-t: #FBE7DE;
  --blue-t: #E6ECF5; --blue-d: #26406A;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.015em; text-wrap: pretty; }
p { margin: 0; text-wrap: pretty; }

/* ---------- Presentation frame ---------- */
.stage { min-height: 100vh; display: grid; grid-template-columns: minmax(300px, 380px) auto minmax(300px, 380px); justify-content: center; align-items: center; gap: 24px; padding: 24px; }
.rail, .side { align-self: stretch; display: flex; flex-direction: column; gap: 24px; padding: 16px 8px; max-height: calc(100vh - 48px); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.slogan { font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.meta { font-size: 14px; color: var(--muted); line-height: 1.4; }
.stages { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.stg { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 500 15px var(--body); text-align: left; cursor: pointer; }
.stg:hover { background: rgba(21,33,59,.06); }
.stg .num { width: 24px; height: 24px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #DCD7CC; color: var(--ink2); flex: none; }
.stg.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(21,33,59,.08), 0 6px 18px rgba(21,33,59,.06); }
.stg.on .num { background: var(--green); color: #fff; }
.stg.done .num { background: #CFE3D6; color: var(--green-d); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5E6878; }
.panel { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 1px 2px rgba(21,33,59,.06), 0 6px 18px rgba(21,33,59,.05); }
.who { display: flex; align-items: center; gap: 14px; }
.av { width: 48px; height: 48px; border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; font: 700 20px var(--display); flex: none; }
.av-giver { background: var(--green-t); color: var(--green-d); } .av-recipient { background: var(--coral-t); color: var(--coral-d); }
.av-both { background: var(--blue-t); color: var(--blue-d); } .av-neutral { background: #E4DFD5; color: var(--ink2); }
.dbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid #CFC9BD; background: #fff; color: var(--ink); font: 600 16px var(--body); cursor: pointer; }
.dbtn:hover { border-color: var(--ink); }
.dbtn:disabled { color: #8A93A3; border-color: #DDD8CE; background: #F3F0EA; cursor: default; }
.principles { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid #D9D3C7; }
.pr { display: flex; gap: 10px; font-size: 14px; line-height: 1.4; color: var(--ink2); }

.device { padding: 8px; background: var(--ink); border-radius: 46px; box-shadow: 0 34px 70px -24px rgba(21,33,59,.5); }
.phone { width: 390px; height: 844px; border-radius: 38px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; position: relative; }

@media (max-height: 900px) and (min-width: 1101px) { .device { transform: scale(calc((100vh - 40px) / 860)); transform-origin: center; } }
@media (max-width: 1100px) {
  .stage { display: block; padding: 0; }
  .rail, .side { display: none; }
  .device { padding: 0; border-radius: 0; background: none; box-shadow: none; display: flex; justify-content: center; min-height: 100vh; }
  .phone { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; border-radius: 0; }
}

/* ---------- Phone UI ---------- */
.demobar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; border-bottom: 1px dashed #D6D0C4; background: var(--bg); }
.role { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.role-giver { background: var(--green-t); color: var(--green-d); } .role-recipient { background: var(--coral-t); color: var(--coral-d); }
.role-both { background: var(--blue-t); color: var(--blue-d); } .role-neutral { background: #E9E5DD; color: var(--ink2); }
.rdot { width: 8px; height: 8px; border-radius: 4px; background: currentColor; display: inline-block; }
.restart { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D6D0C4; background: #fff; color: var(--ink2); font: 600 13px var(--body); cursor: pointer; }
.restart:hover { color: var(--ink); border-color: var(--ink); }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.screen.enter { animation: ppIn .22s ease both; }
@keyframes ppIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes ppSpin { to { transform: rotate(360deg); } }
@keyframes ppDrop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
.scroll::-webkit-scrollbar { width: 0; }
.pad { padding: 20px; gap: 14px; }
.foot { flex: none; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); background: var(--bg); }
.top { display: flex; align-items: center; gap: 4px; padding: 6px 12px 2px; min-height: 56px; font-weight: 700; font-size: 17px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border: 0; border-radius: 14px; font: 600 17px var(--body); cursor: pointer; padding: 0 20px; transition: transform .08s ease, background .15s ease; }
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--green); color: #fff; } .btn-primary:hover { background: #18663F; }
.btn-primary:disabled { background: #BFCFC5; color: #F7FAF8; cursor: default; }
.btn-secondary { background: #fff; color: var(--ink); border: 1.5px solid #D6D0C4; } .btn-secondary:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink2); min-height: 46px; } .btn-ghost:hover { color: var(--ink); text-decoration: underline; }
.btn-light { background: #fff; color: var(--ink); }
.btn-outline-light { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.45); }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: rgba(21,33,59,.06); }
.card { background: #fff; border-radius: 18px; box-shadow: 0 1px 2px rgba(21,33,59,.06), 0 4px 16px rgba(21,33,59,.05); }
.free { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--green); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6878; }
.val { font-size: 16px; line-height: 1.4; }
.sub { font-size: 14px; color: var(--muted); line-height: 1.45; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid #E1DCD2; background: #fff; text-align: left; font: 500 16px var(--body); color: var(--ink); cursor: pointer; }
.opt:hover { border-color: #A9B0BC; }
.opt .dot { width: 22px; height: 22px; border-radius: 11px; border: 2px solid #A9B0BC; flex: none; background: #fff; }
.opt.on { border-color: var(--green); background: #F0F7F2; } .opt.on .dot { border: 7px solid var(--green); }
.amt { min-height: 54px; border-radius: 14px; border: 1.5px solid #D6D0C4; background: #fff; font: 600 17px var(--body); color: var(--ink); cursor: pointer; }
.amt:hover { border-color: var(--ink); }
.amt.on { border-color: var(--green); background: #F0F7F2; color: var(--green-d); box-shadow: inset 0 0 0 1px var(--green); }
.ic { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic-social { background: var(--blue-t); color: var(--blue-d); } .ic-give { background: var(--coral-t); color: #A8461F; } .ic-env { background: var(--green-t); color: var(--green-d); }
.cause { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--coral-d); }
.qa { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 1.5px solid #E1DCD2; background: #fff; font: 600 14px var(--body); color: var(--ink); text-align: left; cursor: pointer; }
.qa:hover { border-color: #A9B0BC; }
.feeditem { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; border: 0; border-radius: 16px; background: #fff; text-align: left; cursor: pointer; color: var(--ink); box-shadow: 0 1px 2px rgba(21,33,59,.06); }
.feeditem:hover { box-shadow: 0 1px 2px rgba(21,33,59,.08), 0 6px 18px rgba(21,33,59,.08); }
.thumb { width: 64px; height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.img { border-radius: 18px; overflow: hidden; background: #EFE9DF; position: relative; flex: none; }
.img svg { display: block; width: 100%; height: 100%; }
.img .free { position: absolute; top: 12px; left: 12px; }
.tbtn { padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; width: 72px; height: 56px; cursor: pointer; background: #EFE9DF; flex: none; }
.tbtn svg { display: block; width: 100%; height: 100%; }
.tbtn.on { border-color: var(--green); }
.mini { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--green); background: #fff; color: var(--green-d); font: 700 14px var(--body); cursor: pointer; }
.mini:disabled { border-color: #CFE3D6; background: var(--green-t); cursor: default; }
.spin { width: 46px; height: 46px; border-radius: 23px; border: 4px solid var(--green-t); border-top-color: var(--green); animation: ppSpin .8s linear infinite; }
.chk { width: 22px; height: 22px; accent-color: var(--green); flex: none; margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 700; }
.rows > div { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #EEEAE2; }
.rows > div:last-child { border-bottom: 0; }
.col { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.pav { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; font: 700 18px var(--display); flex: none; }
.banner { position: absolute; top: 62px; left: 12px; right: 12px; z-index: 8; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; line-height: 1.35; box-shadow: 0 10px 24px rgba(21,33,59,.28); animation: ppDrop .22s ease both; pointer-events: none; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 112px; z-index: 9; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; line-height: 1.4; text-align: center; box-shadow: 0 10px 24px rgba(21,33,59,.28); animation: ppIn .2s ease both; pointer-events: none; }
.dark { background: var(--ink); color: #fff; }
.dark .foot { background: var(--ink); border-top-color: #2E3D5C; }
.dark .iconbtn:hover { background: rgba(255,255,255,.08); }
.dpill { background: rgba(255,255,255,.08); color: #E8ECF3; font-weight: 600; }
.mdl { padding: 14px 16px; border-radius: 16px; background: #1F2D4A; display: flex; flex-direction: column; gap: 6px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2E3D5C; font-size: 15px; }
.kv span:last-child { color: #F6B79C; font-weight: 600; text-align: right; }
.sheetwrap { position: absolute; inset: 0; background: rgba(21,33,59,.42); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; background: #fff; border-radius: 26px 26px 0 0; padding: 26px 24px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: ppIn .2s ease both; }
textarea, input[type=number] { font-family: var(--body); }
:focus-visible { outline: 3px solid #2E6FD1; outline-offset: 2px; }

/* ---------- Screen map overlay ---------- */
.mapwrap { position: fixed; inset: 0; z-index: 50; background: rgba(21,33,59,.5); display: none; overflow: auto; padding: 24px; }
.mapwrap.open { display: block; }
.map { max-width: 1640px; margin: 0 auto; background: var(--bg); border-radius: 24px; padding: 40px 44px; display: flex; flex-direction: column; gap: 28px; }
.lanes { display: grid; grid-template-columns: 110px repeat(10, minmax(110px, 1fr)); grid-auto-rows: 96px; gap: 10px; overflow-x: auto; }
.lane { grid-column: 1 / -1; border-radius: 14px; }
.ll { display: flex; align-items: center; padding-left: 14px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; z-index: 1; }
.bx { background: #fff; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 1px 2px rgba(21,33,59,.08); z-index: 1; cursor: pointer; border: 0; text-align: left; color: var(--ink); font-family: var(--body); }
.bx:hover { box-shadow: 0 0 0 2px var(--green); }
.bx b { font-size: 14.5px; line-height: 1.2; } .bx small { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.n { width: 26px; height: 26px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.ng { background: var(--green); } .nr { background: #B4532A; } .ns { background: var(--blue-d); }
.alts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
.alt { background: #fff; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(21,33,59,.08); }
.flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.st { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #F1EEE8; }
</style>
</head>
<body>
<div class="stage">
  <aside class="rail">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="brand"><span id="logo1"></span>[PROJECT NAME]</div>
      <div class="slogan">Pass the good forward.</div>
      <div class="meta">Interactive investor demo · First pilot: Malmö, Sweden</div>
    </div>
    <nav class="stages" id="stages" aria-label="Demo stages"></nav>
  </aside>
  <div class="device"><div class="phone" id="phone"></div></div>
  <aside class="side" id="side"></aside>
</div>
<div class="mapwrap" id="mapwrap" role="dialog" aria-label="Screen map"></div>

<script>
(function () {
  // ---------- Icons ----------
  const I = (d, s = 20, w = 1.8, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
  const P = {

    swap: '<path d="M7 7h12l-3-3"/><path d="M17 17H5l3 3"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',

    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

    env: '<path d="M20 12a8 8 0 0 1-13.7 5.7"/><path d="M4 12a8 8 0 0 1 13.7-5.7"/><path d="M17.8 3v3.6h-3.6"/><path d="M6.2 21v-3.6h3.6"/>',
    msg: '<path d="M4 5h16v11H9l-5 4z"/>', cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',

    box: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
    ruler: '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    arrow: '<path d="M5 12h14M14 7l5 5-5 5"/>', map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
    lamp: '<path d="M9 3h6l-1 6h3l-6 12 1-8H8z"/>', games: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 6V4M16 6V4"/>',
    pot: '<path d="M6 20h12M8 20l1-9h6l1 9"/><path d="M12 11V7"/><path d="M12 7c-3 0-5-2-5-4 3 0 5 1.5 5 4zM12 7c3 0 5-2 5-4-3 0-5 1.5-5 4z"/>',
    shelf: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 9h14M5 15h14"/>',
    kettle: '<path d="M6 10h11v7a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M17 12h1.5a2 2 0 0 1 0 4H17"/><path d="M9 6c0-1 1-1 1-2M13 6c0-1 1-1 1-2"/>',
    helmet: '<path d="M3 15a9 9 0 0 1 18 0v1H3z"/><path d="M9 7l1 8M15 7l-1 8"/>'
  };
  const LOGO = (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#1E7A4C"/><circle cx="11" cy="15" r="4.2" fill="none" stroke="#fff" stroke-width="2"/><path d="M17 15h7M21 12l3 3-3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  document.getElementById('logo1').innerHTML = LOGO(30);

  // ---------- Item illustration ----------

      <div class="foot"><button class="btn btn-light" data-a="go:s19">View impact model</button><button class="btn btn-outline-light" data-a="restart">Restart demo</button></div>`;
    },

    s19: (d) => {
      const m = (lbl, c, f, demo) => `<div class="mdl"><span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${c}">${lbl}</span><span style="font-size:16px;line-height:1.4">${f}</span><span style="font-size:14px;color:#A9B4C8">${demo}</span></div>`;
      return `<div class="top"><button class="iconbtn" data-a="back" aria-label="Back to summary">${I(P.back, 22, 2)}</button><span>Impact model</span></div>
      <div class="scroll" style="padding:4px 22px 20px;gap:16px">
        <h1 style="font-size:26px;line-height:1.1">Every completed handover is a measurable unit of impact.</h1>
        <div class="col" style="gap:10px">
          ${m('Social', '#BFD0F0', 'People helped = completed handovers', 'This demo: 1 desk, received free')}
          ${m('Charitable', '#F6B79C', 'New giving = handovers × share who donate × average gift', `This demo: SEK ${d.amountVal > 0 ? d.amountVal : 100}, voluntary`)}
          ${m('Environmental', '#8FD8AE', 'Kept in use = handovers × average item weight', 'This demo: ~12 kg (estimate)')}
        </div>
        <div class="col" style="gap:0;border-top:1px solid #2E3D5C">
          <span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A9B4C8;padding:14px 0 6px">Malmö pilot inputs</span>
          <div class="kv"><span>Completed handovers per month</span><span>[PILOT TARGET]</span></div>
          <div class="kv"><span>Share of recipients who donate</span><span>[TO MEASURE]</span></div>
          <div class="kv"><span>Average gift</span><span>[TO MEASURE]</span></div>
          <div class="kv" style="border-bottom:0"><span>Average weight by category</span><span>[CATEGORY DATA]</span></div>
        </div>
        <p style="font-size:14px;line-height:1.5;color:#A9B4C8">Donations are reported only in aggregate. Individual choices stay private.</p>
      </div>
      <div class="foot"><button class="btn btn-light" data-a="restart">Restart demo</button></div>`;
    }
  };

  // ---------- Render ----------
  const phone = document.getElementById('phone');
  const RL = { intro: ['Demo intro', 'role-neutral'], giver: ['Giver · Anna', 'role-giver'], recipient: ['Recipient · Daniel', 'role-recipient'], both: ['Giver + Recipient', 'role-both'], investor: ['Investor view', 'role-neutral'] };
  const WHO = {
    giver: ['A', 'Anna · Giver', 'Västra Hamnen, Malmö', 'av-giver'], recipient: ['D', 'Daniel · Recipient', 'Malmö', 'av-recipient'],
    both: ['2', 'Anna and Daniel', 'Handover in person', 'av-both'], investor: ['i', 'Investor view', 'Outside the consumer app', 'av-neutral'],
    intro: ['1', 'Demo intro', 'Before the journey starts', 'av-neutral']
  };

  function render() {
    const d = derived();
    const role = ROLE[S.screen];
    const sameScreen = lastScreen === S.screen;
    const oldScroll = phone.querySelector('.scroll');
    const keep = sameScreen && oldScroll ? oldScroll.scrollTop : 0;
    const dark = S.screen === 's18' || S.screen === 's19';
    phone.innerHTML = `<div class="demobar"><span class="role ${RL[role][1]}"><span class="rdot"></span>${RL[role][0]}</span><button class="restart" data-a="restart">${I(P.restart, 16, 2)}Restart demo</button></div>
      <div class="screen${sameScreen ? '' : ' enter'}${dark ? ' dark' : ''}">${SCREENS[S.screen](d)}</div>
      ${S.banner ? `<div class="banner">${I(P.swap, 18, 2)}<span>${S.banner}</span></div>` : ''}
      ${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
    const sc = phone.querySelector('.scroll');
    if (sc && keep) sc.scrollTop = keep;
    lastScreen = S.screen;
    renderPanels(role);
  }

  function renderPanels(role) {
    const stage = STAGE[S.screen] || 1;
    document.getElementById('stages').innerHTML = STAGES.map((s, i) => `<button class="stg${i + 1 === stage ? ' on' : i + 1 < stage ? ' done' : ''}" data-a="jump:${s[1]}"><span class="num">${i + 1}</span><span>${s[0]}</span></button>`).join('');
    const w = WHO[role] || WHO.intro;
    const cur = STAGES[stage - 1];
    document.getElementById('side').innerHTML = `
      <span class="label">Now viewing</span>
      <div class="panel who" style="padding:18px"><span class="av ${w[3]}">${w[0]}</span><span class="col"><span style="font-weight:700;font-size:18px">${w[1]}</span><span style="font-size:14px;color:var(--muted)">${w[2]}</span></span></div>
      <div class="panel col" style="gap:10px;padding:22px"><span style="font-size:13px;font-weight:700;color:var(--green)">Stage ${stage} of 13</span><span style="font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1">${cur[0]}</span><span style="font-size:16px;line-height:1.5;color:var(--ink2)">${cur[2]}</span></div>
      <div class="col" style="gap:10px">
        <button class="dbtn" data-a="switch" ${SWITCH[S.screen] ? '' : 'disabled'}>${I(P.swap, 20)}Switch perspective</button>
        <button class="dbtn" data-a="restart">${I(P.restart, 20)}Restart demo</button>
        <button class="dbtn" data-a="map">${I(P.map, 20)}Screen map</button>
      </div>
      <div class="principles"><span class="label">Built in</span>
        ${['Every item is free. No prices, offers or paid priority.', 'The donation invitation appears only after the item is received.', 'The giver never learns whether or how much the recipient gave.', 'No ratings, altruism scores or leaderboards.'].map((t) => `<div class="pr"><span style="color:var(--green);flex:none">${I(P.check, 18, 2.2)}</span><span>${t}</span></div>`).join('')}
      </div>`;
  }

  function set(patch) { Object.assign(S, patch); render(); }
  function go(screen, extra) {
    const from = ROLE[S.screen], to = ROLE[screen];
    let banner = '';
    if (screen === 's14') banner = 'Private to Daniel. Anna never sees this screen.';
    else if (from !== to) banner = to === 'giver' ? 'Now viewing as Anna, the giver' : to === 'recipient' ? 'Now viewing as Daniel, the recipient' : to === 'both' ? 'Anna and Daniel meet for the handover' : '';
    set(Object.assign({ screen, toast: '', banner, chat: false, paying: false }, extra || {}));
    if (banner) later(() => { if (S.banner === banner) set({ banner: '' }); }, 2600);
  }
  function toast(msg) { set({ toast: msg }); later(() => { if (S.toast === msg) set({ toast: '' }); }, 2600); }
  function restart() { timers.forEach(clearTimeout); timers = []; S = fresh(); lastScreen = null; render(); }

  const HINTS = { give: "In this demo Anna is giving. Tap 'Give an item'.", photo: 'Photos are simulated in this demo.', desk: "For this demo, follow Anna's desk." };
  const QA = { there: "Anna has been told you'll be there.", late: 'Anna has been notified: running 15 minutes late.', resched: 'Anna will be asked to choose a new time slot.' };

  function act(a, el) {
    const [k, v] = a.split(':');
    switch (k) {
      case 'go': return go(v);
      case 'jump': closeMap(); return go(v, v === 's12' ? { annaOk: false, danielOk: false } : null);
      case 'switch': if (SWITCH[S.screen]) go(SWITCH[S.screen]); return;
      case 'restart': return restart();
      case 'back': if (PREV[S.screen]) go(PREV[S.screen]); return;
      case 'hint': return toast(HINTS[v]);
      case 'photo': return set({ photo: v });
      case 'annaCause': return set({ annaCause: v, dCat: null, charity: null });
      case 'slot': return set({ slot: v });
      case 'chk1': return set({ chk1: el.checked });
      case 'chk2': return set({ chk2: el.checked });
      case 'sendRequest': if (S.chk1 && S.chk2) go('s9'); return;
      case 'pick': return set({ pick: v });
      case 'reserve': return S.pick === 'daniel' ? go('s10') : toast('For this demo, reserve the desk for Daniel.');
      case 'qa': return toast(QA[v]);
      case 'chat': return set({ chat: !S.chat });
      case 'sofia': set({ sofia: true }); return toast('Sofia gets the pickup details automatically.');
      case 'annaGave': return set({ annaOk: true });
      case 'danielGot': return set({ danielOk: true });
      case 'qr': set({ annaOk: true, danielOk: true }); return toast('QR code matched. Both sides confirmed.');
      case 'handover': return (S.annaOk && S.danielOk) ? go('s13') : set({ annaOk: true, danielOk: true });
      case 'annaDone': return go('s14', { amount: null, other: '' });
      case 'amount': set({ amount: v === 'other' ? 'other' : Number(v) }); if (v === 'other') { const i = document.getElementById('other'); if (i) i.focus(); } return;
      case 'donate': if (derived().amountVal > 0) go('s16'); return;
      case 'openCause': return go('s15', { tmpCat: null, tmpCharity: null });
      case 'tmpCat': return set({ tmpCat: v, tmpCharity: null });
      case 'tmpCharity': return set({ tmpCharity: v });
      case 'causeContinue': { const [c, ch] = el.dataset.v.split('|'); go('s14', { dCat: c, charity: ch }); return toast('Cause set: ' + CATS[c] + '.'); }
      case 'pay': return set({ pay: v });
      case 'confirmPay': if (S.paying) return; set({ paying: 'auth' }); later(() => set({ paying: 'done' }), 1100); later(() => go('s17'), 1900); return;
      case 'map': return openMap();
      case 'closeMap': return closeMap();
    }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el || el.type === 'checkbox' || el.disabled) return;
    act(el.dataset.a, el);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.type === 'checkbox' && el.dataset.a) act(el.dataset.a, el);
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'msg') S.msg = el.value;
    if (el.id === 'other') {
      S.other = el.value;
      const n = parseInt(el.value, 10);
      const b = document.getElementById('donateBtn');
      if (b) { b.disabled = !(n > 0); b.textContent = n > 0 ? 'Donate SEK ' + n : 'Choose an amount to donate'; }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });

  // ---------- Screen map ----------
  const mapwrap = document.getElementById('mapwrap');
  function bx(col, row, n, cls, title, note, screen) { return `<button class="bx" style="grid-column:${col};grid-row:${row}" data-a="jump:${screen}"><span class="n ${cls}">${n}</span><b>${title}</b><small>${note}</small></button>`; }
  const lanes = () => `<div class="lane" style="grid-row:1;background:#E6F0E9"></div><div class="lane" style="grid-row:2;background:#E7EBF2"></div><div class="lane" style="grid-row:3;background:#F8E9E1"></div>
    <div class="ll" style="grid-column:1;grid-row:1;color:var(--green-d)">Giver</div><div class="ll" style="grid-column:1;grid-row:2;color:var(--blue-d)">Shared</div><div class="ll" style="grid-column:1;grid-row:3;color:var(--coral-d)">Recipient</div>`;
  const arrowSm = `<span style="color:var(--muted)">${I(P.arrow, 18, 2)}</span>`;
  function openMap() {
    mapwrap.innerHTML = `<div class="map">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-end">
        <div class="col" style="gap:6px"><h1 style="font-size:44px;letter-spacing:-.02em">Screen map</h1><p style="font-size:17px;color:var(--ink2)">Giver and recipient journeys · follow the numbers · click any screen to jump there</p></div>
        <div class="row" style="gap:16px;font-size:14px;font-weight:600;flex-wrap:wrap"><span class="row" style="gap:8px"><span class="n ng">A</span>Giver: Anna</span><span class="row" style="gap:8px"><span class="n nr">D</span>Recipient: Daniel</span><span class="row" style="gap:8px"><span class="n ns">+</span>Shared or investor view</span><button class="dbtn" data-a="closeMap" style="width:auto;padding:0 18px">${I(P.x, 18, 2)}Close</button></div>
      </div>
      <div class="col" style="gap:12px"><h2 style="font-size:22px;font-weight:600">Part 1 · List, discover, request</h2><div class="lanes">${lanes()}
        ${bx(2, 2, '01', 'ns', 'Big idea', 'See how it works', 's1')}${bx(3, 1, '02', 'ng', 'Home', 'Give an item', 's2')}${bx(4, 1, '03', 'ng', 'Create listing', 'Price: Free · Continue', 's3')}
        ${bx(5, 1, '04', 'ng', 'Suggest a cause', 'Optional · Publish', 's4')}${bx(6, 1, '05', 'ng', 'Published', 'Switch to recipient', 's5')}${bx(7, 3, '06', 'nr', 'Free items feed', "Open Anna's desk", 's6')}
        ${bx(8, 3, '07', 'nr', 'Item details', 'Request this item', 's7')}${bx(9, 3, '08', 'nr', 'Structured request', 'Time slot · Send', 's8')}${bx(10, 1, '09', 'ng', 'Choose recipient', 'No scores · Reserve', 's9')}
      </div></div>
      <div class="col" style="gap:12px"><h2 style="font-size:22px;font-weight:600">Part 2 · Pickup, handover, voluntary giving</h2><div class="lanes">${lanes()}
        ${bx(2, 1, '10', 'ng', 'Reserved', 'Backup queue · Confirm', 's10')}${bx(3, 3, '11', 'nr', 'Pickup details', "Address revealed · I've arrived", 's11')}${bx(4, 2, '12', 'ns', 'Confirm handover', 'Both confirm · QR optional', 's12')}
        ${bx(5, 1, '13', 'ng', "Anna's completion", 'No donation info · Done', 's13')}${bx(6, 3, '14', 'nr', 'Donation invitation', 'Private · no preset amount', 's14')}${bx(7, 3, '15', 'nr', 'Choose a cause', 'Verified partners', 's15')}
        ${bx(8, 3, '16', 'nr', 'Simulated payment', 'Apple Pay · Google Pay · Card', 's16')}${bx(9, 3, '17', 'nr', "Daniel's completion", 'Three impacts · Finish', 's17')}${bx(10, 2, '18', 'ns', 'Investor summary', 'View impact model', 's18')}${bx(11, 2, '19', 'ns', 'Impact model', 'Restart demo', 's19')}
      </div></div>
      <div class="col" style="gap:12px"><h2 style="font-size:22px;font-weight:600">Alternative paths</h2><div class="alts">
        <div class="alt"><b style="font-size:17px">Skip the donation</b><div class="flow"><span class="st">14 · Not now</span>${arrowSm}<span class="st">“The item was free and remains free”</span>${arrowSm}<span class="st">18</span></div><span class="sub">No repeat prompt. Profile and access unchanged.</span></div>
        <div class="alt"><b style="font-size:17px">Change the cause</b><div class="flow"><span class="st">14 · Choose another cause</span>${arrowSm}<span class="st">15 · Pick cause + partner</span>${arrowSm}<span class="st">Back to 14, new cause</span></div><span class="sub">Anna's suggestion is marked but never required.</span></div>
        <div class="alt"><b style="font-size:17px">Pickup cancelled</b><div class="flow"><span class="st">11 · Cancel request</span>${arrowSm}<span class="st">Back to queue</span>${arrowSm}<span class="st">Anna: next person</span></div><span class="sub">No penalties, no negative ratings.</span></div>
      </div></div></div>`;
    mapwrap.classList.add('open');
  }
  function closeMap() { mapwrap.classList.remove('open'); }
  mapwrap.addEventListener('click', (e) => { if (e.target === mapwrap) closeMap(); });

  render();
})();
</script>
</body>
</html>
